<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient (Warm Butter Pastel) -->
    <linearGradient id="butterBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0"/>
      <stop offset="50%" stop-color="#FCEEA7"/>
      <stop offset="100%" stop-color="#F6DA76"/>
    </linearGradient>

    <!-- Vinyl Record Radial Shimmer -->
    <radialGradient id="vinylGrooves" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#121212"/>
      <stop offset="25%" stop-color="#242424"/>
      <stop offset="30%" stop-color="#181818"/>
      <stop offset="55%" stop-color="#282828"/>
      <stop offset="60%" stop-color="#151515"/>
      <stop offset="85%" stop-color="#2c2c2c"/>
      <stop offset="90%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#111111"/>
    </radialGradient>

    <!-- Center Label Gradient -->
    <linearGradient id="centerLabel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Smooth Drop Shadow for Vinyl -->
    <filter id="vinylShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#78590C" flood-opacity="0.32"/>
    </filter>

    <!-- Center Shadow -->
    <filter id="centerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

    <!-- Wave Clip Path for Squircle -->
    <clipPath id="squircleClip">
      <rect x="16" y="16" width="480" height="480" rx="108" ry="108"/>
    </clipPath>
  </defs>

  <!-- Base Icon Container: Apple/Android Style Modern Squircle -->
  <g clip-path="url(#squircleClip)">
    <!-- 1. Warm Butter Background -->
    <rect x="0" y="0" width="512" height="512" fill="url(#butterBg)"/>

    <!-- Subtle Texture / Ambient Highlight -->
    <circle cx="256" cy="-40" r="280" fill="#FFFFFF" opacity="0.35"/>

    <!-- 2. The Classic MIO Vinyl Disc -->
    <g filter="url(#vinylShadow)">
      <!-- Main Vinyl Body -->
      <circle cx="256" cy="236" r="168" fill="url(#vinylGrooves)"/>

      <!-- Concentric Grooves (Micro rings) -->
      <circle cx="256" cy="236" r="150" fill="none" stroke="#333333" stroke-width="1.2" opacity="0.6"/>
      <circle cx="256" cy="236" r="132" fill="none" stroke="#222222" stroke-width="1.5" opacity="0.8"/>
      <circle cx="256" cy="236" r="114" fill="none" stroke="#3a3a3a" stroke-width="1.0" opacity="0.5"/>
      <circle cx="256" cy="236" r="96" fill="none" stroke="#262626" stroke-width="1.5" opacity="0.7"/>
      <circle cx="256" cy="236" r="78" fill="none" stroke="#383838" stroke-width="1.2" opacity="0.5"/>

      <!-- Vinyl Reflection Flares (Anisotropic Sheen) -->
      <path d="M 256 236 L 140 120 A 168 168 0 0 1 372 120 Z" fill="#FFFFFF" opacity="0.06"/>
      <path d="M 256 236 L 372 352 A 168 168 0 0 1 140 352 Z" fill="#FFFFFF" opacity="0.06"/>

      <!-- Center Vinyl Label (Warm Honey Amber) -->
      <circle cx="256" cy="236" r="52" fill="url(#centerLabel)" filter="url(#centerShadow)"/>
      <circle cx="256" cy="236" r="48" fill="none" stroke="#D97706" stroke-width="1.5" opacity="0.5"/>

      <!-- Spindle Hole -->
      <circle cx="256" cy="236" r="14" fill="#121212"/>
      <circle cx="256" cy="236" r="12" fill="#000000"/>
    </g>

    <!-- 3. MIO Signature Organic Wavy Bottom Flow (Charcoal & Cream Double Wave) -->
    <!-- Cream Outer Wave -->
    <path d="M -10 370 
             C 80 340, 140 390, 220 360 
             C 300 330, 370 380, 440 355 
             C 480 342, 510 350, 530 355 
             L 530 530 L -10 530 Z" 
          fill="#FFFDF5" opacity="0.95"/>

    <!-- Charcoal Dark Wave (Matches Player Bar) -->
    <path d="M -10 405 
             C 70 380, 130 425, 210 395 
             C 290 365, 360 415, 430 390 
             C 475 375, 505 385, 530 390 
             L 530 530 L -10 530 Z" 
          fill="#1E1E1E"/>

    <!-- 4. MIO Modern Soundwave Equalizer on the Dark Wave -->
    <g fill="#FDE68A" transform="translate(196, 435)">
      <!-- Soundwave Bars ||| | | ||| -->
      <rect x="0" y="8" width="5" height="18" rx="2.5"/>
      <rect x="10" y="2" width="5" height="30" rx="2.5"/>
      <rect x="20" y="11" width="5" height="12" rx="2.5"/>
      <rect x="30" y="0" width="5" height="34" rx="2.5"/>
      <rect x="40" y="6" width="5" height="22" rx="2.5"/>
      <rect x="50" y="12" width="5" height="10" rx="2.5"/>
      <rect x="60" y="3" width="5" height="28" rx="2.5"/>
      <rect x="70" y="7" width="5" height="20" rx="2.5"/>
      <rect x="80" y="10" width="5" height="14" rx="2.5"/>
      <rect x="90" y="4" width="5" height="26" rx="2.5"/>
      <rect x="100" y="9" width="5" height="16" rx="2.5"/>
      <rect x="110" y="13" width="5" height="8" rx="2.5"/>
    </g>

    <!-- 5. Stylized 'N' Monogram / Music Note at Top Left -->
    <g transform="translate(56, 56)">
      <circle cx="28" cy="28" r="28" fill="#1E1E1E" opacity="0.12"/>
      <path d="M 20 38 L 20 18 L 36 38 L 36 18" 
            fill="none" stroke="#1E1E1E" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
